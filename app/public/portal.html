<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('alphacore-theme'); } catch (e) { /* private window */ }
    if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
    // A visitor here is a customer, not staff: their own browser's language is the better first guess.
    try { if (!localStorage.getItem('alphacore-lang') && /^ar\b/i.test(navigator.language || '')) localStorage.setItem('alphacore-lang', 'ar'); } catch (e) { /* ignore */ }
  })();
</script>
