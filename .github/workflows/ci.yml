name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 22.5 is the floor because node:sqlite does not exist below it.
        os: [ubuntu-latest, windows-latest]
        node: ['22.x', '24.x']

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test

      # Both proofs run the real system end to end in mock mode: no provider
      # key, no network, no cost — and they fail loudly rather than skipping.
      - name: Prove the core promises
        run: npm run prove

      - name: Prove the platform layer
        run: npm run prove:platform

      # A generated spec nobody regenerates is a hand-written spec with extra
      # steps, and it will be wrong within a fortnight and trusted anyway.
      - name: The API description is current
        run: npm run openapi:check

      # Same argument, applied to the document that makes the argument. A README
      # claiming every number is measured cannot carry counts that disagree with
      # the catalogue — or with each other. Measured against an empty database,
      # so the answer does not depend on whose machine ran it.
      - name: The README's numbers are current
        run: npm run readme:check

  audit:
    name: Launch audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - run: npm ci --no-audit --no-fund

      # /api/ping is the one endpoint that needs no credential, so this is a
      # real readiness check rather than a fixed sleep dressed up as one.
      - name: Start the server
        run: |
          npm start &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8484/api/ping; then exit 0; fi
            sleep 1
          done
          echo "the server never came up"
          exit 1
        env:
          ALPHACORE_MOCK: 'true'

      # Blocks the build on a released secret, a broken chain, an unwired
      # department or an endpoint nobody guards.
      - name: Audit
        run: node scripts/launch-audit.mjs

  secrets:
    name: No secrets in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Nothing under data/, no keys, no .env
        run: |
          bad=$(git ls-files | grep -E '(^|/)data/|\.env$|\.env\..*|\.key$|\.pem$' | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "These files must never be committed:"
            echo "$bad"
            exit 1
          fi
          echo "clean"

  # Every department, opened. The console has no build step and no framework, so
  # a broken render is a runtime error in one function and nothing else notices:
  # unit tests never open a page, and the launch audit checks that a department
  # has a route, not that the route draws anything.
  sweep:
    name: Browser sweep
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - run: npm ci --no-audit --no-fund

      # A throwaway database with a known password. The first-run account is
      # generated and must be changed before the API answers, which is correct
      # behaviour and useless to a sweep.
      - name: A database to sweep
        run: |
          node --experimental-sqlite -e "
            import('./src/db.js').then(async ({ exec }) => {
              const { hashPassword } = await import('./src/auth.js');
              const { seedAdmin } = await import('./src/auth.js');
              seedAdmin();
              exec('UPDATE users SET pass = ?, must_change = 0', hashPassword('sweep-password-1'));
            });
          "
        env:
          ALPHACORE_DB: data/ci-sweep.db
          ALPHACORE_MOCK: 'true'

      - name: Start the server
        run: |
          ALPHACORE_DB=data/ci-sweep.db ALPHACORE_MOCK=true PORT=8484 \
            node --experimental-sqlite src/server.js > /tmp/server.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8484/api/ping >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8484/api/ping || (cat /tmp/server.log && exit 1)

      - name: Start a browser
        run: |
          google-chrome --headless=new --remote-debugging-port=9222 \
            --no-sandbox --disable-gpu --disable-dev-shm-usage about:blank > /tmp/chrome.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9222/json/version >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:9222/json/version >/dev/null || (cat /tmp/chrome.log && exit 1)

      # 140 departments x 2 themes x 2 languages x 2 viewports.
      - name: Sweep
        run: npm run sweep -- --user=owner --pass=sweep-password-1
