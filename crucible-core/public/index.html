<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlphaCore — Operations Console</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%2314100c'/><polygon points='50,20 78,50 50,80 22,50' fill='%23e0714f'/></svg>">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app" id="app">
  <!-- Icon rail: one button per division. The 76 departments live one click
       deeper, so the shell stays quiet until you ask it for something. -->
  <aside class="rail" id="rail">
    <a class="rail-brand" href="#/" title="AlphaCore">◆</a>
    <div id="rail-items"></div>
    <div class="rail-spacer"></div>
    <button class="rail-btn" id="rail-search" type="button" aria-label="Search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span class="rail-tip" data-i18n="Search  Ctrl+K">Search · Ctrl+K</span>
    </button>
  </aside>

  <nav class="flyout" id="flyout" hidden aria-label="Departments"></nav>

  <main class="main">
    <header class="topbar">
      <h1 id="page-title">Overview</h1>
      <button class="top-search" id="open-palette" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span data-i18n="Search departments, actions…">Search departments, actions…</span>
        <kbd>Ctrl K</kbd>
      </button>
      <div class="top-right">
        <span id="poll-chip" class="chip chip-warn" title="This page normally refreshes itself; it is paused so your typing is not lost" hidden>✎ auto-refresh paused</span>
        <span id="chain-chip" class="chip chip-dim" title="Audit hash-chain integrity">chain —</span>
        <button class="icon-btn wide" id="lang-toggle" type="button" title="العربية / English">ع</button>
        <button class="icon-btn" id="theme-toggle" type="button" title="Day / night" aria-pressed="false">◐</button>
        <button class="who-chip" id="who-chip" type="button" title="Sign out">
          <span class="avatar" id="who-avatar">—</span>
          <span>
            <span class="who-name" id="who-name">—</span><br>
            <span class="who-role" id="who-role"></span>
          </span>
        </button>
      </div>
    </header>
    <section id="view" class="view"></section>
  </main>
</div>

<!-- Command palette: every department and every quick action, one keystroke away -->
<div id="palette" hidden>
  <div class="pal-box" role="dialog" aria-modal="true" aria-label="Command palette">
    <input type="text" id="pal-input" autocomplete="off" spellcheck="false" placeholder="Jump to a department…">
    <div class="pal-list" id="pal-list"></div>
    <div class="pal-foot">
      <span>↑↓ <span data-i18n="navigate">navigate</span></span>
      <span>↵ <span data-i18n="open">open</span></span>
      <span>esc <span data-i18n="close">close</span></span>
    </div>
  </div>
</div>

<!-- The way in. Two states in one panel: sign in, and — on first run — choose a
     password, because the generated one was only ever meant to get you here. -->
<div id="login" hidden>
  <div class="login-panel">
    <div class="login-mark">◆</div>
    <h1 class="login-name">ALPHACORE</h1>
    <p class="login-tag" data-i18n="The company that runs itself">The company that runs itself</p>

    <form id="login-form" class="login-form" autocomplete="on">
      <label class="fl" for="login-user" data-i18n="Username">Username</label>
      <input type="text" id="login-user" name="username" autocomplete="username" spellcheck="false" required>
      <label class="fl login-gap" for="login-pass" data-i18n="Password">Password</label>
      <input type="password" id="login-pass" name="password" autocomplete="current-password" required>
      <button class="btn btn-primary login-go" id="login-go" type="submit" data-i18n="Sign in">Sign in</button>
    </form>

    <form id="pw-form" class="login-form" hidden autocomplete="on">
      <p class="login-note" data-i18n="This account is still using the password generated when the server first started. Choose your own before going any further.">
        This account is still using the password generated when the server first started. Choose your own before going any further.</p>
      <label class="fl" for="pw-current" data-i18n="Current password">Current password</label>
      <input type="password" id="pw-current" name="current-password" autocomplete="current-password" required>
      <label class="fl login-gap" for="pw-next" data-i18n="New password">New password</label>
      <input type="password" id="pw-next" name="new-password" autocomplete="new-password" minlength="10" required>
      <label class="fl login-gap" for="pw-again" data-i18n="Type it again">Type it again</label>
      <input type="password" id="pw-again" name="confirm-password" autocomplete="new-password" minlength="10" required>
      <button class="btn btn-primary login-go" id="pw-go" type="submit" data-i18n="Set the password">Set the password</button>
    </form>

    <div id="login-err" class="login-err" role="alert" aria-live="polite"></div>

    <div class="login-foot">
      <button class="icon-btn wide" id="login-lang" type="button">العربية</button>
      <button class="icon-btn" id="login-theme" type="button" title="Day / night">◐</button>
    </div>
  </div>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
