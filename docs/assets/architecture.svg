<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="t d">
  <title id="t">AlphaCore architecture</title>
  <desc id="d">The console talks to one Node process over HTTP and a WebSocket. Inside the process: the route table and its permission resolver, the departments, the workers and scheduler, the hash-chained audit log, and one SQLite file. Everything that leaves the machine passes the egress gate to AI providers, connectors, public data and the timestamp authority. Irreversible acts wait for a named person.</desc>
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#123a57" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#070b14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a2e"/>
      <stop offset="1" stop-color="#0a1121"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1f52"/>
      <stop offset="1" stop-color="#171236"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1a2640"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4fe3f0"/>
    </marker>
    <marker id="arrowV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a98bff"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f6b64c"/>
    </marker>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .label { font-size: 12px; letter-spacing: 2.4px; }
    .body { font-size: 13.5px; fill: #c3cee3; }
    .faint { font-size: 12px; fill: #7d8aa5; }
    .chip { font-size: 12.5px; fill: #dbe5f6; }
  </style>

  <rect width="1200" height="800" rx="22" fill="#070b14"/>
  <rect width="1200" height="800" rx="22" fill="url(#dots)"/>
  <rect width="1200" height="800" rx="22" fill="url(#glow)"/>

  <text x="36" y="54" class="mono label" fill="#4fe3f0">THE ARCHITECTURE</text>
  <text x="36" y="92" class="sans" font-size="28" font-weight="300" fill="#eef3fb">Everything inside one process. One gate out. People hold the irreversible.</text>

  <!-- The console -->
  <g transform="translate(36 150)">
    <rect width="230" height="430" rx="16" fill="url(#panel)" stroke="#1d2a44"/>
    <text x="20" y="34" class="mono label" fill="#4fe3f0">THE CONSOLE</text>
    <g transform="translate(20 52)">
      <rect width="190" height="104" rx="10" fill="#0c1426" stroke="#26385a"/>
      <circle cx="14" cy="13" r="3.5" fill="#ff6fae"/><circle cx="26" cy="13" r="3.5" fill="#f6b64c"/><circle cx="38" cy="13" r="3.5" fill="#45d49a"/>
      <line x1="0" y1="26" x2="190" y2="26" stroke="#26385a"/>
      <circle cx="140" cy="66" r="28" fill="none" stroke="#4fe3f0" stroke-opacity="0.7"/>
      <ellipse cx="140" cy="66" rx="12" ry="28" fill="none" stroke="#4fe3f0" stroke-opacity="0.4"/>
      <line x1="112" y1="66" x2="168" y2="66" stroke="#4fe3f0" stroke-opacity="0.4"/>
      <rect x="14" y="40" width="70" height="8" rx="4" fill="#4fe3f0" fill-opacity="0.55"/>
      <rect x="14" y="56" width="52" height="6" rx="3" fill="#7d8aa5" fill-opacity="0.5"/>
      <rect x="14" y="70" width="60" height="6" rx="3" fill="#7d8aa5" fill-opacity="0.5"/>
      <rect x="14" y="84" width="40" height="6" rx="3" fill="#f6b64c" fill-opacity="0.6"/>
    </g>
    <text x="20" y="196" class="sans body">Vanilla JS, run as written</text>
    <text x="20" y="226" class="sans body">No framework, no build step</text>
    <text x="20" y="256" class="sans body">English and Arabic, RTL</text>
    <text x="20" y="286" class="sans body">Light and dark themes</text>
    <text x="20" y="316" class="sans body">Phone layout, installable</text>
    <text x="20" y="346" class="sans body">Zero external requests</text>
    <text x="20" y="392" class="sans faint">Pages read the record and the</text>
    <text x="20" y="410" class="sans faint">live-data cache — never the internet</text>
  </g>

  <!-- console ⇄ process -->
  <text x="276" y="292" class="mono" font-size="11" fill="#7d8aa5">HTTP</text>
  <line x1="268" y1="302" x2="326" y2="302" stroke="#4fe3f0" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="276" y="352" class="mono" font-size="11" fill="#7d8aa5">WS /live</text>
  <line x1="268" y1="362" x2="326" y2="362" stroke="#4fe3f0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <!-- One process -->
  <g transform="translate(330 130)">
    <rect width="520" height="520" rx="18" fill="url(#panel)" stroke="#2b4a6e" stroke-width="1.4"/>
    <text x="20" y="34" class="mono label" fill="#4fe3f0">ONE NODE PROCESS</text>
    <text x="500" y="34" text-anchor="end" class="mono" font-size="12" fill="#7d8aa5">node src/server.js</text>

    <rect x="20" y="60" width="480" height="44" rx="10" fill="#0c1730" stroke="#2b4a6e"/>
    <text x="36" y="87" class="sans" font-size="13.5" fill="#eef3fb"><tspan class="mono" fill="#4fe3f0">api.js</tspan>  the route table · every path resolves to one permission</text>

    <g class="sans chip">
      <g transform="translate(20 122)"><rect width="150" height="38" rx="9" fill="#0e1830" stroke="#223453"/><text x="14" y="24">AI workforce · runs</text></g>
      <g transform="translate(185 122)"><rect width="150" height="38" rx="9" fill="#0e1830" stroke="#223453"/><text x="14" y="24">Router · budgets</text></g>
      <g transform="translate(350 122)"><rect width="150" height="38" rx="9" fill="#0e1830" stroke="#223453"/><text x="14" y="24">Software factory</text></g>
      <g transform="translate(20 170)"><rect width="150" height="38" rx="9" fill="#0e1830" stroke="#223453"/><text x="14" y="24">Review board</text></g>
      <g transform="translate(185 170)"><rect width="150" height="38" rx="9" fill="#0e1830" stroke="#223453"/><text x="14" y="24">Self-improvement</text></g>
      <g transform="translate(350 170)"><rect width="150" height="38" rx="9" fill="#0e1830" stroke="#223453"/><text x="14" y="24">Night shift</text></g>
      <g transform="translate(20 218)"><rect width="150" height="38" rx="9" fill="#0e1830" stroke="#223453"/><text x="14" y="24">Live data</text></g>
      <g transform="translate(185 218)"><rect width="150" height="38" rx="9" fill="#0e1830" stroke="#223453"/><text x="14" y="24">Radar · atlas · naming</text></g>
      <g transform="translate(350 218)"><rect width="150" height="38" rx="9" fill="#0e1830" stroke="#223453"/><text x="14" y="24">Markets desk</text></g>
      <g transform="translate(20 266)"><rect width="150" height="38" rx="9" fill="#181a2c" stroke="#3b3360"/><text x="14" y="24">Enterprise core</text></g>
      <g transform="translate(185 266)"><rect width="150" height="38" rx="9" fill="#181a2c" stroke="#3b3360"/><text x="14" y="24">Cap table · finance</text></g>
      <g transform="translate(350 266)"><rect width="150" height="38" rx="9" fill="#181a2c" stroke="#3b3360"/><text x="14" y="24">Governance floor</text></g>
    </g>
    <text x="260" y="324" text-anchor="middle" class="sans faint">…and every other department: a module with an overview() and its actions</text>

    <rect x="20" y="340" width="232" height="62" rx="10" fill="#0c1730" stroke="#223453"/>
    <text x="36" y="366" class="sans" font-size="13.5" fill="#eef3fb">Workers · scheduler</text>
    <text x="36" y="388" class="sans faint">runs, leases, retries, server ticks</text>
    <rect x="268" y="340" width="232" height="62" rx="10" fill="#0d2420" stroke="#1f5a48"/>
    <text x="284" y="366" class="sans" font-size="13.5" fill="#eef3fb"><tspan class="mono" fill="#45d49a">audit.js</tspan>  the chain</text>
    <text x="284" y="388" class="sans faint">SHA-256, append-only, verifiable</text>

    <g transform="translate(20 420)">
      <path d="M0 16 v52 a240 14 0 0 0 480 0 v-52" fill="#0c1426" stroke="#2b4a6e"/>
      <ellipse cx="240" cy="16" rx="240" ry="14" fill="#11203a" stroke="#2b4a6e"/>
      <text x="240" y="56" text-anchor="middle" class="sans" font-size="14" fill="#eef3fb">SQLite — one file · <tspan class="mono" fill="#4fe3f0">node:sqlite</tspan></text>
      <text x="240" y="76" text-anchor="middle" class="sans faint">append-only migrations · the whole company in data/alphacore.db</text>
    </g>
  </g>

  <!-- process → gate -->
  <line x1="852" y1="390" x2="886" y2="390" stroke="#a98bff" stroke-width="1.8" marker-end="url(#arrowV)"/>

  <!-- The gate -->
  <g transform="translate(890 130)">
    <rect width="62" height="520" rx="14" fill="url(#gate)" stroke="#5b4aa6"/>
    <text transform="translate(38 260) rotate(-90)" text-anchor="middle" class="mono label" fill="#cdbfff">egress.js · THE ONE GATE OUT</text>
  </g>

  <!-- Outside -->
  <g class="sans">
    <g transform="translate(974 130)">
      <rect width="190" height="118" rx="14" fill="url(#panel)" stroke="#1d2a44"/>
      <text x="16" y="28" class="mono label" fill="#a98bff">AI PROVIDERS</text>
      <text x="16" y="52" class="body">Claude subscription</text>
      <text x="16" y="72" class="body">Anthropic · OpenAI · Gemini</text>
      <text x="16" y="92" class="body">DeepSeek · Groq · more</text>
      <text x="16" y="110" class="faint">local: Ollama, llama.cpp</text>
    </g>
    <g transform="translate(974 264)">
      <rect width="190" height="118" rx="14" fill="url(#panel)" stroke="#1d2a44"/>
      <text x="16" y="28" class="mono label" fill="#a98bff">CONNECTORS</text>
      <text x="16" y="52" class="body">GitHub · Slack · Gmail</text>
      <text x="16" y="72" class="body">Stripe · Telegram · MCP</text>
      <text x="16" y="92" class="body">a browser agents drive</text>
      <text x="16" y="110" class="faint">and any HTTP API</text>
    </g>
    <g transform="translate(974 398)">
      <rect width="190" height="118" rx="14" fill="url(#panel)" stroke="#1d2a44"/>
      <text x="16" y="28" class="mono label" fill="#a98bff">PUBLIC DATA</text>
      <text x="16" y="52" class="body">Rates · weather · air</text>
      <text x="16" y="72" class="body">World Bank · NASA · arXiv</text>
      <text x="16" y="92" class="body">registries · Hacker News</text>
      <text x="16" y="110" class="faint">keyless, kept with its time</text>
    </g>
    <g transform="translate(974 532)">
      <rect width="190" height="118" rx="14" fill="url(#panel)" stroke="#1d2a44"/>
      <text x="16" y="28" class="mono label" fill="#a98bff">THE WITNESS</text>
      <text x="16" y="52" class="body">A timestamp authority</text>
      <text x="16" y="72" class="body">signs the chain's head</text>
      <text x="16" y="92" class="body">on a schedule</text>
      <text x="16" y="110" class="faint">a rewrite cannot hide</text>
    </g>
  </g>
  <g stroke="#a98bff" stroke-width="1.6" marker-end="url(#arrowV)">
    <line x1="952" y1="189" x2="970" y2="189"/>
    <line x1="952" y1="323" x2="970" y2="323"/>
    <line x1="952" y1="457" x2="970" y2="457"/>
    <line x1="952" y1="591" x2="970" y2="591"/>
  </g>

  <!-- People -->
  <line x1="590" y1="652" x2="590" y2="684" stroke="#f6b64c" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrowA)"/>
  <line x1="921" y1="652" x2="921" y2="684" stroke="#f6b64c" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrowA)"/>
  <g transform="translate(36 688)">
    <rect width="1128" height="78" rx="16" fill="#1d1608" stroke="#6b5122"/>
    <circle cx="40" cy="39" r="17" fill="none" stroke="#f6b64c" stroke-width="1.6"/>
    <circle cx="40" cy="33" r="5.5" fill="#f6b64c"/>
    <path d="M30 49 a10 9 0 0 1 20 0" fill="#f6b64c"/>
    <text x="74" y="34" class="mono label" fill="#f6b64c">PEOPLE</text>
    <text x="74" y="58" class="sans" font-size="14.5" fill="#f3e6cc">Agents propose; people apply. Money, merges, publishing and messages to people wait for a named person — and the chain says who.</text>
  </g>
</svg>
