<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">The life of an act that leaves the machine</title>
  <desc id="d">Six stations. An agent or a page proposes an act by its capability name. The intent is written to the hash chain before anything happens. The gate checks scope, allowlist, quota, the constitution and the value ceiling, and fails closed. An irreversible act or one that moves money waits for a named person. The call goes out, or in dry-run is only recorded. The verdict and the result join the chain. A refused attempt leaves a record too.</desc>
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#16314f" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#070b14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="track" gradientUnits="userSpaceOnUse" x1="120" y1="0" x2="1080" y2="0">
      <stop offset="0" stop-color="#4fe3f0"/>
      <stop offset="0.5" stop-color="#a98bff"/>
      <stop offset="0.68" stop-color="#f6b64c"/>
      <stop offset="1" stop-color="#45d49a"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1a2640"/>
    </pattern>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .step { font-size: 12px; letter-spacing: 2.4px; }
    .head { font-size: 16px; fill: #eef3fb; }
    .sub { font-size: 12.5px; fill: #8a97b2; }
  </style>
  <rect width="1200" height="360" rx="22" fill="#070b14"/>
  <rect width="1200" height="360" rx="22" fill="url(#dots)"/>
  <rect width="1200" height="360" rx="22" fill="url(#glow)"/>

  <text x="36" y="52" class="mono step" fill="#4fe3f0">THE LIFE OF AN OUTWARD ACT</text>
  <text x="36" y="88" class="sans" font-size="26" font-weight="300" fill="#eef3fb">Nothing leaves the machine except through one gate, in this order.</text>

  <line x1="120" y1="160" x2="1080" y2="160" stroke="url(#track)" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="160" x2="1080" y2="160" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2 10"/>

  <g class="sans">
    <g transform="translate(120 160)">
      <circle r="24" fill="#0b1324" stroke="#4fe3f0" stroke-width="2"/>
      <text y="5" text-anchor="middle" class="mono" font-size="14" fill="#4fe3f0">1</text>
      <text y="58" text-anchor="middle" class="mono step" fill="#4fe3f0">PROPOSE</text>
      <text y="84" text-anchor="middle" class="head">An agent asks</text>
      <text y="106" text-anchor="middle" class="sub">by capability name:</text>
      <text y="124" text-anchor="middle" class="sub">repo.push, mail.send…</text>
    </g>
    <g transform="translate(312 160)">
      <circle r="24" fill="#0b1324" stroke="#6fbff5" stroke-width="2"/>
      <text y="5" text-anchor="middle" class="mono" font-size="14" fill="#6fbff5">2</text>
      <text y="58" text-anchor="middle" class="mono step" fill="#6fbff5">RECORD</text>
      <text y="84" text-anchor="middle" class="head">Intent is chained</text>
      <text y="106" text-anchor="middle" class="sub">written to the audit chain</text>
      <text y="124" text-anchor="middle" class="sub">before anything happens</text>
    </g>
    <g transform="translate(504 160)">
      <circle r="24" fill="#0b1324" stroke="#a98bff" stroke-width="2"/>
      <text y="5" text-anchor="middle" class="mono" font-size="14" fill="#a98bff">3</text>
      <text y="58" text-anchor="middle" class="mono step" fill="#a98bff">CHECK</text>
      <text y="84" text-anchor="middle" class="head">The gate decides</text>
      <text y="106" text-anchor="middle" class="sub">scope → allowlist → quota →</text>
      <text y="124" text-anchor="middle" class="sub">constitution → value ceiling</text>
    </g>
    <g transform="translate(696 160)">
      <circle r="24" fill="#1d1608" stroke="#f6b64c" stroke-width="2"/>
      <text y="5" text-anchor="middle" class="mono" font-size="14" fill="#f6b64c">4</text>
      <text y="58" text-anchor="middle" class="mono step" fill="#f6b64c">HOLD</text>
      <text y="84" text-anchor="middle" class="head">A person says yes</text>
      <text y="106" text-anchor="middle" class="sub">money, merges, publishing,</text>
      <text y="124" text-anchor="middle" class="sub">messages to people</text>
    </g>
    <g transform="translate(888 160)">
      <circle r="24" fill="#0b1324" stroke="#7fdcb0" stroke-width="2"/>
      <text y="5" text-anchor="middle" class="mono" font-size="14" fill="#7fdcb0">5</text>
      <text y="58" text-anchor="middle" class="mono step" fill="#7fdcb0">ACT</text>
      <text y="84" text-anchor="middle" class="head">The call goes out</text>
      <text y="106" text-anchor="middle" class="sub">or, in dry-run, is only</text>
      <text y="124" text-anchor="middle" class="sub">recorded, never sent</text>
    </g>
    <g transform="translate(1080 160)">
      <circle r="24" fill="#0d2420" stroke="#45d49a" stroke-width="2"/>
      <path d="M-8 1 l5 6 l11 -13" fill="none" stroke="#45d49a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="58" text-anchor="middle" class="mono step" fill="#45d49a">SEAL</text>
      <text y="84" text-anchor="middle" class="head">The result is chained</text>
      <text y="106" text-anchor="middle" class="sub">verdict, rule, outcome —</text>
      <text y="124" text-anchor="middle" class="sub">verifiable from the header</text>
    </g>
  </g>
  <text x="600" y="334" text-anchor="middle" class="mono" font-size="12" letter-spacing="1" fill="#55627c">Fails closed: a rule that cannot be evaluated is a refusal — and a refused attempt leaves a record too.</text>
</svg>
